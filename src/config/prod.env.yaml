application:
  port: 3008
  prefix: ""
  default_password: "admin123456"

  # 日志配置
  logger:
    info:
      level: 'debug'
      filename: 'info-%DATE%.log'
      dirname: 'logs/%DATE%'
      datePattern: 'YYYY-MM-DD'
      # 文件大小限制，单位M
      maxSize: '10M'
    error:
      level: 'error'
      filename: 'error-%DATE%.log'
      dirname: 'logs/%DATE%'
      datePattern: 'YYYY-MM-DD'
      # 文件大小限制，单位M
      maxSize: '10M'

