version: '3.8'

services:
  frontend:
    image: 'swr.cn-north-4.myhuaweicloud.com/weipengcheng/xlt-admin-frontend:latest'
    pull_policy: always  # 确保每次启动拉取最新镜像
    ports:
      - "80:80"
    restart: always
    networks:
      - common-network

  nest-app:
    image: 'swr.cn-north-4.myhuaweicloud.com/weipengcheng/xlt-admin-backend:1.0.1'  # 固定后端版本
    pull_policy: always  # 确保使用最新的 1.0.0 版本（但不会自动升级到 1.0.1）
    env_file:
      - .env
    ports:
      - '3008:3008'
    networks:
      - common-network
    environment:
      - DATABASE_URL=mysql://root:${MYSQL_ROOT_PASSWORD}@mysql-container:3306/${MYSQL_DATABASE}
      - REDIS_HOST=redis-container
      - REDIS_PORT=6379
    restart: always

  mysql-container:
    image: mysql:8.0
    volumes:
      - ./data/mysql:/var/lib/mysql
    command: mysqld --character-set-server=utf8mb4 --collation-server=utf8mb4_general_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
    networks:
      - common-network
    restart: always
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost" ]
      interval: 10s
      retries: 5
      start_period: 20s

  redis-container:
    image: redis:6.2
    volumes:
      - ./data/redis:/data
    networks:
      - common-network
    restart: always
    command: redis-server --appendonly yes

networks:
  common-network:
    driver: bridge
